name: Actualizar Productos y Precios (Amazon)

on:
  schedule:
    # Se ejecuta automáticamente cada 6 horas (00:00, 06:00, 12:00, 18:00 UTC)
    # Recomendado para evitar bloqueos/captchas de Amazon y optimizar minutos
    - cron: '0 */6 * * *'
    # Si deseas que sea exactamente cada hora, puedes cambiarlo por: '0 * * * *'

  # Permite ejecutarlo manualmente en cualquier momento desde la pestaña "Actions" de GitHub
  workflow_dispatch:

permissions:
  contents: write # Permite al bot guardar y subir el nuevo gadgets.json al repositorio

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🌐 Instalar Chromium de Playwright
        run: npx playwright install --with-deps chromium

      - name: 🔄 Ejecutar actualización de productos
        run: npm run refresh

      - name: 🚀 Comprobar cambios y desplegar a Netlify
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Verificar si src/data/gadgets.json tiene modificaciones
          if git status --porcelain src/data/gadgets.json | grep -q 'src/data/gadgets.json'; then
            echo "✅ Se detectaron cambios en precios/productos. Guardando cambios..."
            git add src/data/gadgets.json
            git commit -m "chore: actualizar precios y catálogo de Amazon"
            git push
            echo "🎉 Commit realizado con éxito. Netlify iniciará el despliegue automáticamente."
          else
            echo "ℹ️ No hubo cambios en los precios ni en los productos. No es necesario desplegar."
          fi
