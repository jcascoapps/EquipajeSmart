<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#d97706" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- Suitcase Handle -->
  <path d="M26 19 V15 C26 13.3 27.3 12 29 12 H35 C36.7 12 38 13.3 38 15 V19" 
        fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Main Suitcase Body with soft shadow -->
  <rect x="16" y="19" width="32" height="34" rx="6" fill="none" stroke="url(#goldGrad)" stroke-width="3" filter="url(#glow)" />

  <!-- Smart Stripes / Ribs (Luggage Grooves) -->
  <line x1="26" y1="24" x2="26" y2="48" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round" />
  <line x1="38" y1="24" x2="38" y2="48" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round" />

  <!-- Center Smart Plane Symbol -->
  <path d="M32 26 L36 34 L43 35 L38 38 L39 44 L32 40 L25 44 L26 38 L21 35 L28 34 Z" 
        fill="url(#accentGrad)" />

  <!-- Small Wheels -->
  <rect x="20" y="53" width="4" height="3" rx="1.5" fill="#f59e0b" />
  <rect x="40" y="53" width="4" height="3" rx="1.5" fill="#f59e0b" />
</svg>